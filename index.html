<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Fun Learning Time</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 15%, #fff4c7 0 70px, transparent 71px),
        radial-gradient(circle at 90% 20%, #dff7ff 0 90px, transparent 91px),
        linear-gradient(135deg, #fffaf0, #eefaff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      color: #344054;
    }

    .page {
      width: 100%;
      max-width: 850px;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      border: 3px solid #ffffff;
      border-radius: 30px;
      padding: 35px;
      box-shadow: 0 18px 50px rgba(72, 91, 110, 0.14);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #fff0b8;
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 52px);
      color: #26364a;
      margin-bottom: 10px;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 17px;
      color: #718096;
      margin-bottom: 28px;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 22px;
      background: #eef2f5;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
      position: relative;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .hint {
      margin-top: 20px;
      font-size: 14px;
      color: #8a94a6;
    }

    .decorations {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 18px;
      font-size: 24px;
    }

    .footer {
      margin-top: 22px;
      font-size: 12px;
      color: #a0a8b5;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 22px 16px;
        border-radius: 24px;
      }

      .subtitle {
        font-size: 15px;
      }

      .video-wrapper {
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <div class="badge">
        ✨ WATCH • LEARN • PLAY ✨
      </div>

      <h1>Fun Learning Time! 🐱</h1>

      <p class="subtitle">
        Watch your activity come to life!
      </p>

      <div class="video-wrapper">

        <!-- Replace YOUR_GOOGLE_DRIVE_FILE_ID with your actual Drive file ID -->

        <iframe
          src="https://drive.google.com/file/d/1ishK8Xe0oxSpBxAMntRaIECkCf809gFq/preview"
          allow="autoplay; fullscreen"
          allowfullscreen>
        </iframe>

      </div>

      <p class="hint">
        ▶️ Tap the play button to watch
      </p>

      <div class="decorations">
        ⭐ 🌈 🐟 🌱 ⭐
      </div>

      <div class="footer">
        A little video to make learning more fun 💛
      </div>

    </section>

  </main>

</body>
</html>

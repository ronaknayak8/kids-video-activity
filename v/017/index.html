<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8e8">
  <title>Слушай и учи</title>
  <style>
    :root {
      --cream: #fff8e8;
      --paper: #fffdf7;
      --yellow: #f5c84b;
      --yellow-dark: #c88a18;
      --teal: #3e7774;
      --ink: #263a38;
      --muted: #65706d;
      --line: #eadfca;
      --shadow: 0 18px 50px rgba(83, 67, 35, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Trebuchet MS", Verdana, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(245, 200, 75, 0.19) 0 120px, transparent 121px),
        linear-gradient(145deg, var(--cream), #f3f6e9 100%);
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      overflow-x: hidden;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 20px 0 24px;
    }

    .topbar {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 800;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--yellow);
      border: 2px solid rgba(38, 58, 56, 0.08);
      box-shadow: 0 7px 18px rgba(171, 132, 35, 0.16);
    }

    .activity-label {
      flex: 0 0 auto;
      border: 1px solid rgba(62, 119, 116, 0.18);
      border-radius: 999px;
      color: var(--teal);
      background: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      padding: 8px 11px;
    }

    .intro {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .lynx {
      display: block;
      width: 118px;
      height: 118px;
      object-fit: contain;
      filter: drop-shadow(0 12px 18px rgba(83, 67, 35, 0.14));
    }

    h1 {
      margin: 0 0 7px;
      font-size: clamp(24px, 8vw, 38px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .intro-text {
      margin: 0;
      max-width: 380px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .player-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 253, 247, 0.96);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .player-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--yellow), #8bb8a5);
    }

    .player-heading {
      margin: 3px 0 4px;
      font-size: 20px;
      line-height: 1.2;
    }

    .recording-title {
      margin: 0 0 14px;
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .player-main {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      align-items: center;
      gap: 14px;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .play-button {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--ink);
      background: var(--yellow);
      box-shadow: 0 9px 20px rgba(196, 145, 34, 0.28);
      cursor: pointer;
    }

    .play-button:disabled { cursor: not-allowed; opacity: 0.6; box-shadow: none; }
    .play-button:focus-visible, .restart-button:focus-visible, input:focus-visible { outline: 3px solid rgba(62, 119, 116, 0.35); outline-offset: 3px; }

    .play-icon {
      width: 0;
      height: 0;
      margin-left: 5px;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 19px solid var(--ink);
    }

    .pause-icon { display: none; width: 18px; height: 24px; border-left: 7px solid var(--ink); border-right: 7px solid var(--ink); }
    .is-playing .play-icon { display: none; }
    .is-playing .pause-icon { display: block; }

    .timeline { min-width: 0; }

    .seek {
      width: 100%;
      height: 28px;
      margin: 0;
      accent-color: var(--teal);
      cursor: pointer;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: -3px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }

    .restart-button {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--teal);
      background: white;
      font-weight: 800;
      cursor: pointer;
    }

    .status {
      min-height: 20px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status.error { color: #9b4a40; }

    .closing {
      margin: 14px 0 0;
      text-align: center;
      color: var(--teal);
      font-size: 13px;
      font-weight: 800;
    }

    @media (min-width: 600px) {
      body { padding-inline: 24px; }
      .page { padding-top: 28px; }
      .intro { grid-template-columns: 150px minmax(0, 1fr); gap: 24px; margin-bottom: 18px; }
      .lynx { width: 150px; height: 150px; }
      .player-card { padding: 24px; }
      .player-main { grid-template-columns: 88px minmax(0, 1fr) 44px; }
      .play-button { width: 88px; height: 88px; }
      .restart-button { grid-column: 3; }
    }

    @media (max-width: 350px) {
      body { padding-inline: 10px; }
      .intro { grid-template-columns: 92px minmax(0, 1fr); }
      .lynx { width: 92px; height: 92px; }
      .player-main { grid-template-columns: 64px minmax(0, 1fr); }
      .play-button { width: 64px; height: 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar" aria-label="Идентичност на заниманието">
      <div class="brand"><span class="brand-mark" aria-hidden="true">★</span><span>Забавно учене</span></div>
    </header>

    <section class="intro" aria-labelledby="activity-title">
      <img class="lynx" src="/lynx.png" alt="Приветлив усмихнат рис" width="447" height="559">
      <div>
        <h1 id="activity-title">Нека чуем аудио версията на приказката „Русалката и Лунният цвят”!</h1>
        <p class="intro-text">Слушай внимателно и следвай приказката в книжката си.</p>
      </div>
    </section>

    <section class="player-card" aria-labelledby="player-heading">
      <h2 class="player-heading" id="player-heading">Аудио приказка</h2>
      <p class="recording-title">Аудио запис</p>

      <div class="player-main">
        <button class="play-button" id="playButton" type="button" aria-label="Пусни записа" disabled>
          <span class="play-icon" aria-hidden="true"></span><span class="pause-icon" aria-hidden="true"></span>
        </button>

        <div class="timeline">
          <input class="seek" id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Превърти записа" disabled>
          <div class="time-row">
            <span id="currentTime">0:00</span>
            <button class="restart-button" id="restartButton" type="button" aria-label="Започни отначало" title="Отначало" disabled>↺</button>
            <span id="totalTime">0:00</span>
          </div>
        </div>
      </div>

      <p class="status" id="status" role="status" aria-live="polite">Аудиото се подготвя…</p>
      <audio id="audio" preload="metadata"></audio>
    </section>

    <p class="closing">Надявам се да ти хареса!</p>
  </main>

  <script>
    const AUDIO_URL = "https://media.taleybox.online/Audio/audio_128k.mp3"; // Replace this URL to migrate to Bunny Delivery.

    const audio = document.getElementById("audio");
    const playButton = document.getElementById("playButton");
    const restartButton = document.getElementById("restartButton");
    const seek = document.getElementById("seek");
    const currentTime = document.getElementById("currentTime");
    const totalTime = document.getElementById("totalTime");
    const status = document.getElementById("status");

    audio.src = AUDIO_URL;

    const formatTime = (seconds) => {
      if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
      const minutes = Math.floor(seconds / 60);
      const remainder = Math.floor(seconds % 60);
      return `${minutes}:${String(remainder).padStart(2, "0")}`;
    };

    const setUnavailable = (message) => {
      playButton.disabled = true;
      restartButton.disabled = true;
      seek.disabled = true;
      status.textContent = message;
      status.classList.add("error");
      playButton.classList.remove("is-playing");
      playButton.setAttribute("aria-label", "Записът не е наличен");
    };

    const updateProgress = () => {
      const duration = audio.duration;
      if (Number.isFinite(duration) && duration > 0) {
        seek.value = String((audio.currentTime / duration) * 100);
        totalTime.textContent = formatTime(duration);
      }
      currentTime.textContent = formatTime(audio.currentTime);
    };

    audio.addEventListener("loadedmetadata", () => {
      playButton.disabled = false;
      restartButton.disabled = false;
      seek.disabled = false;
      status.classList.remove("error");
      status.textContent = "Готово за слушане";
      updateProgress();
    });

    audio.addEventListener("loadstart", () => {
      status.classList.remove("error");
      status.textContent = "Аудиото се подготвя…";
    });

    audio.addEventListener("canplay", () => {
      if (!audio.error) {
        status.classList.remove("error");
        status.textContent = audio.paused ? "Готово за слушане" : "Възпроизвежда се";
      }
      playButton.disabled = false;
    });

    audio.addEventListener("waiting", () => {
      status.classList.remove("error");
      status.textContent = "Зареждане…";
    });

    audio.addEventListener("playing", () => {
      playButton.classList.add("is-playing");
      playButton.setAttribute("aria-label", "Пауза на записа");
      status.classList.remove("error");
      status.textContent = "Възпроизвежда се";
    });

    audio.addEventListener("pause", () => {
      if (!audio.ended) {
        playButton.classList.remove("is-playing");
        playButton.setAttribute("aria-label", "Продължи записа");
        if (!audio.error) status.textContent = "На пауза";
      }
    });

    audio.addEventListener("timeupdate", updateProgress);

    audio.addEventListener("ended", () => {
      playButton.classList.remove("is-playing");
      playButton.setAttribute("aria-label", "Пусни отново");
      status.textContent = "Край. Натисни бутона, за да слушаш отново.";
      updateProgress();
    });

    audio.addEventListener("error", () => {
      setUnavailable("Аудиото не е налично в момента. Опитай отново, когато записът бъде качен.");
    });

    playButton.addEventListener("click", async () => {
      if (audio.paused) {
        try {
          if (audio.ended) audio.currentTime = 0;
          await audio.play();
        } catch (error) {
          setUnavailable("Възпроизвеждането не можа да започне. Провери връзката си и опитай отново.");
        }
      } else {
        audio.pause();
      }
    });

    restartButton.addEventListener("click", () => {
      audio.currentTime = 0;
      seek.value = "0";
      currentTime.textContent = "0:00";
      if (!audio.paused) status.textContent = "Възпроизвежда се";
      else status.textContent = "Започна отначало";
    });

    seek.addEventListener("input", () => {
      const duration = audio.duration;
      if (!Number.isFinite(duration) || duration <= 0) return;
      audio.currentTime = (Number(seek.value) / 100) * duration;
      updateProgress();
    });

    window.addEventListener("pageshow", () => {
      updateProgress();
    });
  </script>
</body>
</html>

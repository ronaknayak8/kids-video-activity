<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fun Learning Time! 🐱</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff7e6,
          #eaf7ff,
          #f5edff
        );

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;

      background: white;

      border-radius: 28px;

      padding: 28px 22px 30px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.10);

      text-align: center;
    }

    .badge {
      display: inline-block;

      background: #fff3cd;

      color: #7a5a00;

      font-size: 12px;
      font-weight: bold;

      letter-spacing: 0.5px;

      padding: 8px 14px;

      border-radius: 50px;

      margin-bottom: 14px;
    }

    h1 {
      margin: 0;

      font-size: 30px;

      color: #333;

      line-height: 1.2;
    }

    .subtitle {
      margin: 10px 0 22px;

      font-size: 15px;

      color: #777;

      line-height: 1.5;
    }

    /* Portrait video container */
    .video-wrapper {
      width: min(100%, 420px);

      aspect-ratio: 9 / 16;

      overflow: hidden;

      border-radius: 22px;

      background: #eef2f5;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.10);

      position: relative;

      margin: 0 auto;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;

      border: 0;

      display: block;
    }

    .footer {
      margin-top: 20px;

      font-size: 12px;

      color: #999;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 24px 16px 26px;

        border-radius: 24px;
      }

      h1 {
        font-size: 26px;
      }

      .subtitle {
        font-size: 14px;
      }

      .video-wrapper {
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="badge">
      ✨ WATCH • LEARN • PLAY ✨
    </div>

    <h1>
      Fun Learning Time! 🐱
    </h1>

    <div class="subtitle">
      Watch your activity come to life!
    </div>

    <div class="video-wrapper">

      <iframe
        src="https://player.mediadelivery.net/play/753442/73f75148-2bcf-4aa2-8576-ca2add29bab5"
        loading="lazy"
        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
        allowfullscreen>
      </iframe>

    </div>

    <div class="footer">
      Have fun learning! 🌟
    </div>

  </div>

</body>
</html>
